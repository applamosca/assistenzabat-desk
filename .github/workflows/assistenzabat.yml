# =============================================================================
#  AssistenzaBAT - build del client Windows x64 brandizzato
#  Base: RustDesk 1.5.0 (AGPL-3.0). Modifiche applicate al volo in "Branding":
#   - nome app, metadati exe, icone (da branding/icon.svg)
#   - server ID/relay e chiave pubblica del server self-hosted AssistenzaBAT
#  Avvio manuale: Actions -> "AssistenzaBAT Windows" -> Run workflow
# =============================================================================
name: AssistenzaBAT Windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ---- branding / server --------------------------------------------------
  APP_NAME: "AssistenzaBAT"
  APP_DESCRIPTION: "AssistenzaBAT - Assistenza Remota"
  COMPANY: "AssistenzaBAT.it"
  RENDEZVOUS_SERVER: "94.177.201.211"
  RS_PUB_KEY: "RGkJuuuXWzgt5DTD9WKNgLmbJUWFtrgkRI1E0rRXrUQ="
  # ---- toolchain (identico a upstream 1.5.0) ------------------------------
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"

jobs:
  icons:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Genera icone da branding/icon.svg
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick
          mkdir -p out
          for s in 16 24 32 48 64 128 256 512; do
            rsvg-convert -w $s -h $s branding/icon.svg -o out/$s.png
          done
          convert out/16.png out/24.png out/32.png out/48.png out/64.png out/128.png out/256.png out/icon.ico
          convert out/16.png out/24.png out/32.png out/48.png out/64.png out/tray-icon.ico
          cp branding/icon.svg out/icon.svg
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branding-icons
          path: out

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    needs: [icons, generate-bridge, build-RustDeskTempTopMostWindow]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Download icons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: branding-icons
          path: ./branding/out

      - name: Branding AssistenzaBAT
        shell: bash
        run: |
          set -euo pipefail
          CFG=libs/hbb_common/src/config.rs
          # nome app, server e chiave
          sed -i "s|RwLock::new(\"RustDesk\".to_owned())|RwLock::new(\"${APP_NAME}\".to_owned())|" $CFG
          sed -i "s|pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"${RENDEZVOUS_SERVER}\"];|" $CFG
          sed -i "s|pub const RS_PUB_KEY: &str = \".*\";|pub const RS_PUB_KEY: \&str = \"${RS_PUB_KEY}\";|" $CFG
          # metadati exe e nome finestra di fallback
          RC=flutter/windows/runner/Runner.rc
          sed -i "s|VALUE \"ProductName\", \"RustDesk\"|VALUE \"ProductName\", \"${APP_NAME}\"|" $RC
          sed -i "s|VALUE \"FileDescription\", \"RustDesk Remote Desktop\"|VALUE \"FileDescription\", \"${APP_DESCRIPTION}\"|" $RC
          sed -i "s|VALUE \"CompanyName\", \"Purslane Tech Pte. Ltd.\"|VALUE \"CompanyName\", \"${COMPANY}\"|" $RC
          sed -i "s|std::wstring app_name = L\"RustDesk\";|std::wstring app_name = L\"${APP_NAME}\";|" flutter/windows/runner/main.cpp
          # icone
          O=branding/out
          cp $O/icon.ico res/icon.ico
          cp $O/tray-icon.ico res/tray-icon.ico
          cp $O/icon.ico flutter/windows/runner/resources/app_icon.ico
          cp $O/32.png res/32x32.png
          cp $O/64.png res/64x64.png
          cp $O/128.png res/128x128.png
          cp $O/256.png res/128x128@2x.png
          cp $O/512.png res/icon.png
          cp $O/icon.svg flutter/assets/icon.svg
          cp $O/icon.ico flutter/assets/icon.ico
          cp $O/256.png flutter/assets/icon.png
          # verifica: ogni sostituzione deve essere avvenuta
          grep -q "\"${APP_NAME}\".to_owned()" $CFG
          grep -q "${RENDEZVOUS_SERVER}" $CFG
          grep -q "${RS_PUB_KEY}" $CFG
          grep -q "${APP_NAME}" $RC
          grep -q "L\"${APP_NAME}\"" flutter/windows/runner/main.cpp
          echo "Branding applicato:"; grep -n "APP_NAME: RwLock\|RENDEZVOUS_SERVERS:\|RS_PUB_KEY:" $CFG

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./out
          mv ./target/release/rustdesk-portable-packer.exe "./out/${APP_NAME}-${VERSION}-x64.exe"
          sha256sum ./out/*.exe | tee ./out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AssistenzaBAT-windows-x64
          path: ./out

      - name: Publish release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: assistenzabat-${{ env.VERSION }}-build${{ github.run_number }}
          name: AssistenzaBAT ${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            Client di assistenza remota AssistenzaBAT, basato su RustDesk ${{ env.VERSION }} (AGPL-3.0).
            Preconfigurato sul server AssistenzaBAT. Non firmato digitalmente.
          files: |
            ./out/*.exe
            ./out/SHA256SUMS.txt
